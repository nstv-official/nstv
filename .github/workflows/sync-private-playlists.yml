name: Sync private playlist data

on:
  workflow_dispatch:
  push:
    paths:
      - "system_config_v3.data"
      - ".system_parseconfig_v2.dt"
      - "manifest_v4.json"
      - ".github/workflows/sync-private-playlists.yml"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4

      - name: Validate private repository token
        env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
        run: |
          if [ -z "$PRIVATE_DATA_TOKEN" ]; then
            echo "PRIVATE_DATA_TOKEN is not configured."
            exit 1
          fi

      - name: Sync playlist files to private repository
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
          OWNER: nstv-official
          TARGET_REPO: nstv-private-data
          BRANCH: main
        shell: bash
        run: |
          set -euo pipefail

          sync_file() {
            local source_path="$1"
            local target_path="$2"
            local message="$3"

            if [ ! -f "$source_path" ]; then
              echo "Source file not found: $source_path"
              exit 1
            fi

            local api_url="https://api.github.com/repos/${OWNER}/${TARGET_REPO}/contents/${target_path}"
            local sha=""

            response=$(curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${api_url}?ref=${BRANCH}" || true)

            if echo "$response" | jq -e '.sha' >/dev/null 2>&1; then
              sha=$(echo "$response" | jq -r '.sha')
            fi

            content=$(base64 -w 0 "$source_path")

            payload=$(jq -n \
              --arg message "$message" \
              --arg content "$content" \
              --arg branch "$BRANCH" \
              --arg sha "$sha" \
              'if $sha == "" then
                 {message:$message, content:$content, branch:$branch}
               else
                 {message:$message, content:$content, branch:$branch, sha:$sha}
               end')

            curl -fsSL -X PUT \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/json" \
              --data "$payload" \
              "$api_url" >/dev/null

            echo "Synced: $source_path -> $OWNER/$TARGET_REPO/$target_path"
          }

          sync_file "system_config_v3.data" "system_config_v3.data" "sync: update system_config_v3.data"
          sync_file ".system_parseconfig_v2.dt" ".system_parseconfig_v2.dt" "sync: update server-two playlist"
          sync_file "manifest_v4.json" "manifest_v4.json" "sync: update event manifest"
