name: Sync private playlist data

on:
  workflow_dispatch:
  push:
    paths:
      - "system_config_v3.data"
      - ".system_parseconfig_v2.dt"
      - "manifest_v4.json"
      - ".github/workflows/sync-private-playlists.yml"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4

      - name: Check private repository secret
        env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${PRIVATE_DATA_TOKEN:-}" ]; then
            echo "PRIVATE_DATA_TOKEN is empty or unavailable to this workflow."
            echo "Check that it exists under the nstv repository Actions secrets and that this workflow is running from the nstv repository itself."
            exit 1
          fi
          echo "PRIVATE_DATA_TOKEN is available to the workflow (value hidden)."

      - name: Verify access to private repository
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
        run: |
          set -euo pipefail
          status=$(curl -sS -o repo.json -w "%{http_code}" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/nstv-official/nstv-private-data")

          if [ "$status" != "200" ]; then
            echo "GitHub API access failed with HTTP $status."
            echo "The token may not have access to nstv-private-data."
            exit 1
          fi

          echo "Private repository access verified."

      - name: Sync playlist files to private repository
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
          OWNER: nstv-official
          TARGET_REPO: nstv-private-data
          BRANCH: main
        shell: bash
        run: |
          set -euo pipefail

          sync_file() {
            local source_path="$1"
            local target_path="$2"
            local message="$3"

            if [ ! -f "$source_path" ]; then
              echo "Source file not found: $source_path"
              exit 1
            fi

            local api_url="https://api.github.com/repos/${OWNER}/${TARGET_REPO}/contents/${target_path}"
            local sha=""
            local response

            response=$(curl -sS \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${api_url}?ref=${BRANCH}")

            if echo "$response" | jq -e '.sha' >/dev/null 2>&1; then
              sha=$(echo "$response" | jq -r '.sha')
            fi

            local content
            content=$(base64 -w 0 "$source_path")

            local payload
            payload=$(jq -n \
              --arg message "$message" \
              --arg content "$content" \
              --arg branch "$BRANCH" \
              --arg sha "$sha" \
              'if $sha == "" then
                 {message:$message, content:$content, branch:$branch}
               else
                 {message:$message, content:$content, branch:$branch, sha:$sha}
               end')

            curl -fsSL -X PUT \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/json" \
              --data "$payload" \
              "$api_url" >/dev/null

            echo "Synced: $source_path -> $OWNER/$TARGET_REPO/$target_path"
          }

          sync_file "system_config_v3.data" "system_config_v3.data" "sync: update system_config_v3.data"
          sync_file ".system_parseconfig_v2.dt" ".system_parseconfig_v2.dt" "sync: update server-two playlist"
          sync_file "manifest_v4.json" "manifest_v4.json" "sync: update event manifest"
