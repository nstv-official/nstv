name: Validasi & Perbarui Playlist Otomatis

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout Repositori
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Jalankan Skrip Validasi Lengkap
      run: python validate_logos.py

    - name: Commit dan Push Otomatis Perubahan Playlist
      run: |
        git config --local user.email "github-actions[bot]@://github.com"
        git config --local user.name "github-actions[bot]"
        
        git pull origin ${{ github.ref_name }} --rebase || true
        
        # MEMAKSA GIT MENAMBAHKAN FILE YANG BERUBAH DI MEMORI
        git add -f system_config_v3.data .system_parseconfig_v2.dt
        
        if git diff --cached --quiet; then
          echo "Git mendeteksi tidak ada perubahan file setelah skrip berjalan."
        else
          echo "Menemukan perubahan file! Melakukan komit..."
          git commit -m "bot: otomatis perbarui objek tvg_logo epg_metadata [skip ci]"
          git push origin ${{ github.ref_name }}
          echo "Push berhasil dikirim!"
        fi
