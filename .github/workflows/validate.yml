name: Validasi & Perbarui Playlist Otomatis

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout Repositori
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Amankan Direktori Git
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Sinkronisasi Cabang Git
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git pull origin ${{ github.ref_name }} --rebase || true

    - name: Jalankan Skrip Validasi Lengkap
      run: python validate_logos.py

    - name: Commit dan Push Otomatis Perubahan Playlist
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
        GH_REF: ${{ github.ref_name }}
      run: |
        # Memaksa Git memasukkan file samaran teks Anda ke dalam pelacakan
        git add -f system_config_v3.data
        git add -f .system_parseconfig_v2.dt
        
        if [[ -n "$(git status --porcelain)" ]]; then
          echo "Perubahan teks ditemukan! Melakukan pengiriman data..."
          git commit -m "bot: konversi tvg_logo ke URL raw github content [skip ci]"
          
          # PERBAIKAN: Menggunakan sintaks variabel Bash yang benar ($GH_TOKEN, $GH_REPO, $GH_REF)
          git push https://x-access-token:$GH_TOKEN@://github.com HEAD:$GH_REF --force
          echo "🚀 Sukses! Data terbaru telah dipaksa masuk ke repositori."
        else
          echo "Git mendeteksi tidak ada perubahan karakter pada file samaran Anda."
        fi
