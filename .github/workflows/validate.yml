name: Validasi & Perbarui Playlist Otomatis

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout Repositori
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Amankan Direktori Git
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Jalankan Skrip Validasi Lengkap
      run: python validate_logos.py

    - name: Commit dan Push Otomatis Perubahan Playlist
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        # Tarik pembaruan jarak jauh untuk menghindari ketidaksinkronan
        git pull origin ${{ github.ref_name }} --rebase || true
        
        # Paksa Git untuk memasukkan file teks mentah kustom Anda
        git add -f system_config_v3.data .system_parseconfig_v2.dt
        
        # Lakukan komit paksa tanpa memedulikan status pengecekan bawaan
        if ! git diff --cached --quiet; then
          echo "Perubahan terdeteksi di Git cache! Mengirim ke repositori..."
          git commit -m "bot: penyelarasan total epg_metadata tvg_logo [skip ci]"
          git push origin ${{ github.ref_name }}
          echo "Proses push selesai!"
        else
          echo "Perhatian: Git mendeteksi file modifikasi memori sama persis dengan lokal server."
        fi
