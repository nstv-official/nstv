name: Validasi & Perbarui Playlist Otomatis

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout Repositori
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Amankan Direktori Git
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Jalankan Skrip Validasi Lengkap
      run: python validate_logos.py

    - name: Commit dan Push Otomatis Perubahan Playlist
      run: |
        git config --local user.email "github-actions[bot]@://github.com"
        git config --local user.name "github-actions[bot]"
        
        git pull origin ${{ github.ref_name }} --rebase || true
        
        # Paksa Git memasukkan file samaran teks Anda ke dalam cache tracking
        git add -f system_config_v3.data
        git add -f .system_parseconfig_v2.dt
        
        if ! git diff --cached --quiet; then
          echo "Perubahan teks pada file samaran terdeteksi! Melakukan push..."
          git commit -m "bot: pembaruan playlist teks samaran [skip ci]"
          git push origin ${{ github.ref_name }}
          echo "Proses pengiriman file berhasil!"
        else
          echo "Git mendeteksi isi file hasil skrip sama persis dengan yang ada di repositori saat ini."
        fi
