name: Validasi, Bersihkan Duplikat & Urutkan Playlist Multi-File

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout Repositori
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Jalankan Skrip Validasi Lengkap
      run: python validate_logos.py

    - name: Commit dan Push Otomatis Perubahan Playlist
      run: |
        git config --local user.email "github-actions[bot]@://github.com"
        git config --local user.name "github-actions[bot]"
        
        # Mengecek apakah ada perubahan pada berkas spesifik Anda
        if [[ -n "$(git status --porcelain)" ]]; then
          git add system_config_v3.data .system_parseconfig_v2.dt
          git commit -m "bot: otomatis merapikan kedua berkas playlist [skip ci]"
          git push
        else
          echo "Tidak ada perubahan berkas untuk dikomit."
        fi
