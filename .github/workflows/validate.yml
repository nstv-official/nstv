name: Validasi & Perbarui Playlist Otomatis

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout Repositori
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Mengambil seluruh riwayat commit agar push aman

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Jalankan Skrip Validasi Lengkap
      run: python validate_logos.py

    - name: Commit dan Push Otomatis Perubahan Playlist
      run: |
        git config --local user.email "github-actions[bot]@://github.com"
        git config --local user.name "github-actions[bot]"
        
        # Sinkronisasi ulang repositori sebelum melakukan push balik
        git pull origin ${{ github.ref_name }} --rebase
        
        if [[ -n "$(git status --porcelain)" ]]; then
          git add system_config_v3.data .system_parseconfig_v2.dt
          git commit -m "bot: otomatis perbarui objek tvg_logo epg_metadata [skip ci]"
          git push origin ${{ github.ref_name }}
        else
          echo "Tidak ada perubahan berkas untuk dikomit."
        fi
