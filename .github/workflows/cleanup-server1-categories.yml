name: Cleanup Server 1 categories

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove selected categories from Server 1 data
        env:
          TARGETS: >-
            EUFA EROPA LEAGUE|UEFA EUROPA LEAGUE|SUPERCOPA DE ESPANA|SUPERCOPA DE ESPAÑA|SERIE A|OLAHRAGA UFC|OLahraga UFC|UFC
        run: |
          python3 <<'PY'
          import json, os, re
          from pathlib import Path

          path = Path('.system_config_v1.dt')
          raw = path.read_text(encoding='utf-8-sig')
          targets = {re.sub(r'\s+', ' ', x.strip()).casefold() for x in os.environ['TARGETS'].split('|') if x.strip()}
          data = json.loads(raw.lstrip('\ufeff').strip())
          if not isinstance(data, dict) or not isinstance(data.get('channels'), list):
              raise SystemExit('Server 1 data has no supported channels list.')
          channels = data['channels']

          def norm(value):
              return re.sub(r'\s+', ' ', str(value or '').strip()).casefold()

          kept, removed = [], []
          for item in channels:
              category = norm(item.get('category', '')) if isinstance(item, dict) else ''
              if category in targets:
                  removed.append((item.get('id'), item.get('title', ''), item.get('category', '')))
              else:
                  kept.append(item)

          print(f'Original channels: {len(channels)}')
          print(f'Channels removed: {len(removed)}')
          for cid, title, category in removed:
              print(f'REMOVE id={cid!r} category={category!r} title={title!r}')
          if not removed:
              print('No requested Server 1 categories found. Nothing to change.')
              raise SystemExit(0)

          data['channels'] = kept
          path.write_text(json.dumps(data, ensure_ascii=False, indent=4) + '\n', encoding='utf-8')
          print(f'New channel count: {len(kept)}')
          PY

      - name: Commit cleanup
        run: |
          git config user.name "nstv-official"
          git config user.email "officialnstv@gmail.com"
          if git diff --quiet -- .system_config_v1.dt; then
            echo "No changes to commit."
            exit 0
          fi
          git add .system_config_v1.dt
          git commit -m "cleanup: remove selected Server 1 categories"
          git push
